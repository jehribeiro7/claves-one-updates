name: CLAVES ONE - Publicacao

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versao do aplicativo'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Validar versao
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versao invalida"
            exit 1
          fi
          echo "Versao recebida: $VERSION"
          echo "Validacao concluida"
